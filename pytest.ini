[pytest]
# Put the repo root on sys.path so `pytest` and `python -m pytest` behave
# identically. Without this, plain `pytest` cannot import config/ or backtest/.
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    # Surface our own deprecations; third-party noise stays quiet.
    error::DeprecationWarning:backtest.*
    error::DeprecationWarning:strategies.*
    error::FutureWarning:backtest.*
    error::FutureWarning:strategies.*
