[pytest]
# Put the repo root on sys.path so `pytest` and `python -m pytest` behave
# identically. Without this, plain `pytest` cannot import config/ or backtest/.
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    # Our own deprecations must fail now, not change behaviour silently later.
    # This is not hypothetical: it caught a pandas downcasting deprecation in
    # the engine that only fires on ragged (real-world) calendars.
    error::FutureWarning
    error::DeprecationWarning
    # Third-party noise we cannot fix from here.
    default::DeprecationWarning:pkg_resources.*
    default::DeprecationWarning:dateutil.*
